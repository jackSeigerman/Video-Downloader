<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }

        .header p {
            color: #666;
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="url"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="url"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .directory-section {
            display: flex;
            gap: 10px;
            align-items: end;
        }

        .directory-path {
            flex: 1;
        }

        .directory-path input {
            background-color: #f5f5f5;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-top: 20px;
        }

        .video-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }

        .video-info.show {
            display: block;
        }

        .video-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .video-duration {
            color: #666;
            font-size: 14px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            white-space: pre-line;
            max-height: 200px;
            overflow-y: auto;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        @media (max-width: 640px) {
            .directory-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 YouTube Downloader</h1>
            <p>Download videos in the highest quality available as MP4 or convert to MP3</p>
        </div>

        <form id="downloadForm">
            <div class="form-group">
                <label for="videoUrl">YouTube Video URL:</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>

            <div id="videoInfo" class="video-info">
                <div class="video-title" id="videoTitle"></div>
                <div class="video-duration" id="videoDuration"></div>
            </div>

            <div class="form-group">
                <label for="downloadPath">Download Directory:</label>
                <div class="directory-section">
                    <div class="directory-path">
                        <input type="text" id="downloadPath" placeholder="Select download directory..." readonly required>
                    </div>
                    <button type="button" id="selectDir">Browse</button>
                </div>
            </div>

            <div class="form-group">
                <label for="format">Format:</label>
                <select id="format">
                    <option value="mp4">MP4 (Highest Quality Video)</option>
                    <option value="mp3">MP3 (Highest Quality Audio)</option>
                </select>
            </div>

            <button type="submit" class="download-btn" id="downloadBtn">
                📥 Download Video
            </button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
