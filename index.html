<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            margin: 0;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .header h1 {
            color: #333;
            margin: 0;
            font-size: 2.2em;
            font-weight: 300;
        }

        .header p {
            color: #666;
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="url"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="url"]:focus, select:focus {
            outline: none;
            border-color: #000000;
        }

        .directory-section {
            display: flex;
            gap: 8px;
            align-items: stretch;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .directory-section:focus-within {
            border-color: #3700ff;
        }

        .directory-path {
            flex: 1;
        }

        .directory-path input {
            background-color: white;
            border: none;
            border-radius: 0;
            padding: 12px 16px;
            cursor: pointer;
            color: #333;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .directory-path input:hover {
            background-color: #f8f9fa;
        }

        .directory-path input:focus {
            outline: none;
            border: none;
            background-color: white;
        }

        .directory-path input::placeholder {
            color: #999;
        }

        #selectDir {
            background: linear-gradient(135deg, #3700ff 0%, #0400ff 100%);
            border: none;
            border-radius: 0;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            min-width: 80px;
            transition: background 0.2s ease;
        }

        #selectDir:hover {
            background: linear-gradient(135deg, #4a0bff 0%, #1507ff 100%);
            transform: none;
            box-shadow: none;
        }

        button {
            background: linear-gradient(135deg, #3700ff 0%, #0400ff 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-top: 20px;
        }

        .video-info {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }

        .video-info.show {
            display: block;
        }

        .video-info-content {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .video-thumbnail {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .video-details {
            flex: 1;
            min-width: 0;
        }

        .video-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            line-height: 1.3;
            word-wrap: break-word;
        }

        .video-duration {
            color: #666;
            font-size: 14px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            white-space: pre-line;
            max-height: 200px;
            overflow-y: auto;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        @media (max-width: 640px) {
            .directory-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">


        <form id="downloadForm">
            <div class="form-group">
                <label for="videoUrl">Video URL:</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>

            <div id="videoInfo" class="video-info">
                <div class="video-info-content">
                    <img id="videoThumbnail" class="video-thumbnail" src="" alt="Video thumbnail" style="display: none;">
                    <div class="video-details">
                        <div class="video-title" id="videoTitle"></div>
                        <div class="video-duration" id="videoDuration"></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="downloadPath">Download Directory:</label>
                <div class="directory-section">
                    <div class="directory-path">
                        <input type="text" id="downloadPath" placeholder="Select download directory..." readonly required>
                    </div>
                    <button type="button" id="selectDir">Browse</button>
                </div>
            </div>

            <div class="form-group">
                <label for="format">Format:</label>
                <select id="format">
                    <option value="mp4">MP4</option>
                    <option value="mp3">MP3</option>
                </select>
            </div>

            <button type="submit" class="download-btn" id="downloadBtn">
                Download
            </button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
